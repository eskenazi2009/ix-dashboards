name: Ventas IX (GT, SV, RD)

# Sin depender de ninguna PC. Panamá = UTC-5 todo el año.
#  1) 02:30 UTC (9:30 pm Panamá): PEDIR al portal TotalCommerce los exports de los
#     últimos 3 días para las 3 cuentas. El portal contesta por correo a Outlook.
#  2) 10:00 pm Panamá: la rutina de Claude lee esos correos (conector Microsoft 365),
#     saca los enlaces .xlsx y los deja cifrados en inbox/ (cloud/inbox.py), con push.
#  3) Ese push dispara este workflow otra vez: PROCESAR el inbox = bajar los Excel,
#     actualizar ventas-ix.enc y ventas-macro.enc y borrar el sobre.
# Sin cron propio: GitHub lo corría con horas de atraso. Lo dispara la rutina de Claude (10 pm).
on:
  push:
    paths:
      - "inbox/**"
  workflow_dispatch:
    inputs:
      accion:
        description: "pedir | procesar"
        type: choice
        options: [procesar, pedir]
        default: procesar
      dias:
        description: "pedir: cuántos días hacia atrás, terminando AYER"
        default: "3"

permissions:
  contents: write

concurrency:
  group: publicar-sitio
  cancel-in-progress: false

jobs:
  ix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests cryptography openpyxl

      - name: Pedir exports al portal
        if: github.event_name == 'workflow_dispatch' && inputs.accion == 'pedir'
        env:
          DIAS: ${{ inputs.dias || '3' }}
        run: |
          # El portal carga las ventas de un dia durante la noche siguiente: a las 10 pm el
          # dia en curso todavia sale en cero. Por eso se pide hasta AYER (verificado 29-sep).
          HOY=$(TZ=America/Panama date +%F)
          HASTA=$(TZ=America/Panama date -d "$HOY - 1 day" +%F)
          DESDE=$(TZ=America/Panama date -d "$HASTA - $((DIAS-1)) days" +%F)
          python cloud/sync_ix.py pedir --desde "$DESDE" --hasta "$HASTA"
          mkdir -p inbox && echo "{\"desde\":\"$DESDE\",\"hasta\":\"$HASTA\"}" > inbox/pedido.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/pedido.json
          if git diff --cached --quiet; then echo "rango sin cambios"; else
            git commit -qm "IX: rango pedido $DESDE a $HASTA [skip ci]" && git pull --rebase -q && git push -q; fi

      - name: Procesar inbox
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.accion == 'procesar')
        env:
          IX_CLAVE: ${{ secrets.IX_CLAVE }}
          INBOX_PRIV: ${{ secrets.INBOX_PRIV }}
        run: python cloud/procesar_inbox.py

      - name: Publicar
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.accion == 'procesar')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A inbox ventas-ix.enc ventas-macro.enc
          git diff --cached --quiet && echo "sin cambios" && exit 0
          git commit -m "Ventas IX (portal) $(TZ=America/Panama date '+%Y-%m-%d %H:%M')"
          git pull --rebase -X theirs || true
          git push
